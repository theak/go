<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{domain}}/{{name}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  </head>
  <body>
    {% if conflict %}<div class="alert alert-warning">{{domain}}/{{name}} already exists. Access this note at {{domain}}/note/{{name}} or pick a different name.</div>{% endif %}
    <div id="copied" class="alert alert-success d-none">Note contents copied to clipboard</div>
    <div class="container">
      <div><a href="/">‹ Home</a></div><br/>
      <h5 class="pb-2 d-flex justify-content-between align-items-center">
        {{domain}}/{{name}}
        <div class="d-flex align-items-center">
          <label class="btn btn-outline-secondary btn-sm me-2">
            <input type="checkbox" id="markdown" name="markdown" form="noteform" autocomplete="off" class="form-check-input pe-none mt-0 me-1 align-middle" {% if markdown %}checked{% endif %}> Markdown
          </label>
          <button id="copy" type="button" class="btn btn-outline-secondary btn-sm">📋 Copy</button>
        </div>
      </h5>
      <form id="noteform" method="post" action="/note/{{name}}">
        <textarea id="content" name="content" class="form-control mb-2" style="font-family: monospace" rows="20">{{content}}</textarea>
        <div id="rendered" class="form-control mb-2 d-none" style="height:auto"></div>
        <div class="d-flex align-items-center">
          {% if id %}<button type="submit" form="delete" name="action" value="delete" class="btn btn-outline-secondary">🗑️ Delete</button>{% endif %}
          <div class="ms-auto d-flex align-items-center">
            {% if created %}<span class="text-muted small me-3">Created <span id="created">{{created}}</span></span>{% endif %}
            <button id="save" type="submit" class="btn btn-primary" disabled>Save</button>
          </div>
        </div>
      </form>
      {% if id %}<form id="delete" method="post" action="/update_link"><input type="hidden" name="id" value="{{id}}"></form>{% endif %}
    </div>
    <script>
      const content = document.getElementById("content");
      const save = document.getElementById("save");
      const copied = document.getElementById("copied");
      document.getElementById("copy").addEventListener("click", () => {
        if (navigator.clipboard) navigator.clipboard.writeText(content.value).then(() => copied.classList.remove("d-none"));
        else { content.select(); document.execCommand("copy"); copied.classList.remove("d-none"); }
      });
      const created = document.getElementById("created");
      if (created) created.textContent = new Date(created.textContent.replace(" ", "T") + "Z").toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"});
      const rendered = document.getElementById("rendered");
      const markdown = document.getElementById("markdown");
      const saved = content.value;
      const savedMarkdown = markdown.checked;
      function renderView() {
        if (markdown.checked) {
          rendered.innerHTML = marked.parse(content.value);
          rendered.querySelectorAll("table").forEach(t => t.classList.add("table", "table-bordered"));
          content.classList.add("d-none"); rendered.classList.remove("d-none");
        } else {
          content.classList.remove("d-none"); rendered.classList.add("d-none");
        }
      }
      function updateSave() { save.disabled = content.value === saved && markdown.checked === savedMarkdown; }
      content.addEventListener("input", updateSave);
      markdown.addEventListener("change", () => { renderView(); updateSave(); });
      rendered.addEventListener("click", (e) => {
        if (e.target.closest("a")) return;   // let links in the preview work normally
        markdown.checked = false; renderView(); updateSave(); content.focus();
      });
      renderView();
      let uploadSeq = 0;
      function uploadImage(file) {
        const name = file.name || "image";
        const token = `![Uploading ${name} #${++uploadSeq}…]()`;
        content.setRangeText(token, content.selectionStart, content.selectionEnd, "end");
        updateSave();
        const body = new FormData();
        body.append("image", file);
        fetch("/note/upload_image", { method: "POST", body })
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(({ url }) => { content.value = content.value.replace(token, `![${name}](${url})`); })
          .catch(() => { content.value = content.value.replace(token, `![upload failed]()`); })
          .finally(updateSave);
      }
      content.addEventListener("paste", (e) => {
        const files = [...e.clipboardData.items].filter(i => i.type.startsWith("image/")).map(i => i.getAsFile());
        if (files.length) { e.preventDefault(); files.forEach(uploadImage); }
      });
      content.addEventListener("dragover", (e) => e.preventDefault());
      content.addEventListener("drop", (e) => {
        const files = [...e.dataTransfer.files].filter(f => f.type.startsWith("image/"));
        if (files.length) { e.preventDefault(); files.forEach(uploadImage); }
      });
      content.form.addEventListener("submit", () => save.disabled = true);
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          if (!save.disabled) content.form.requestSubmit();
        }
      });
      window.addEventListener("beforeunload", (e) => {
        if (!save.disabled) { e.preventDefault(); e.returnValue = ""; }
      });
      const deleteForm = document.getElementById("delete");
      if (deleteForm) deleteForm.addEventListener("submit", (e) => {
        e.preventDefault();
        save.disabled = true;   // deleting: don't warn about unsaved changes
        const body = new FormData();
        body.append("id", deleteForm.querySelector("[name=id]").value);
        body.append("action", "delete");
        fetch("/update_link", { method: "POST", body })
          .then(() => window.location.href = "/?deleted=" + encodeURIComponent({{ name|tojson }}));
      });
    </script>
  </body>
</html>
