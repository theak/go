<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{domain}}/{{name}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="container">
      <div><a href="/">‹ Home</a></div><br/>
      <h5 class="pb-2">{{domain}}/{{name}}</h5>
      <form method="post" action="/note/{{name}}">
        <textarea id="content" name="content" class="form-control mb-2" style="font-family: monospace" rows="20">{{content}}</textarea>
        <div class="text-end"><button id="save" type="submit" class="btn btn-primary" disabled>Save</button></div>
      </form>
    </div>
    <script>
      const content = document.getElementById("content");
      const save = document.getElementById("save");
      const saved = content.value;
      content.addEventListener("input", () => save.disabled = content.value === saved);
      content.form.addEventListener("submit", () => save.disabled = true);
      window.addEventListener("beforeunload", (e) => {
        if (!save.disabled) { e.preventDefault(); e.returnValue = ""; }
      });
    </script>
  </body>
</html>
